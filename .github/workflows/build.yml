name: Build

# Builds DATRACKARXD for Linux, Windows and macOS on every pull request.
# A release with the binaries is published either by pushing a tag like
# v0.1.0, or from the Actions tab: "Run workflow" with a version such as
# v0.1.0 (the tag is then created on the selected commit).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v0.1.0 (leave empty to only build)'
        required: false
        default: ''

permissions:
  contents: write

env:
  # The release version: the pushed tag, or the version typed in "Run workflow".
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

jobs:
  # The tests and the exports again, with AddressSanitizer and
  # UndefinedBehaviorSanitizer watching every memory access.
  sanitizers:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxinerama-dev libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev \
            libgl1-mesa-dev
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_DISABLE_FIND_PACKAGE_SDL2=ON
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=undefined -O1 -g"
          "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -O1 -g"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build --parallel --target datrackarxd datrackarxd-tests
      - name: Tests
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          ctest --test-dir build --output-on-failure
          exe=build/datrackarxd
          for f in xm mod it; do "$exe" --export-module songs/chips.dtk "chips.$f"; "$exe" --convert "chips.$f" "back-$f.dtk"; done
          "$exe" --export-vgm songs/chips.dtk chips.vgm
          "$exe" --export songs/demo.dtk demo.ogg
          "$exe" --export-midi songs/demo.dtk demo.mid
          "$exe" --convert demo.mid back-mid.dtk

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
          - os: windows-latest
            name: windows-x64
          - os: macos-14
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxinerama-dev libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev \
            libgl1-mesa-dev

      # SDL2 is always built from source and linked statically, so the
      # binaries run without installing anything.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_DISABLE_FIND_PACKAGE_SDL2=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Smoke test
        shell: bash
        run: |
          exe=build/datrackarxd
          [ -f build/Release/datrackarxd.exe ] && exe=build/Release/datrackarxd.exe
          kg=build/datrackarxd-keygen
          [ -f build/Release/datrackarxd-keygen.exe ] && kg=build/Release/datrackarxd-keygen.exe
          "$exe" --version
          # A release must match the version in CMakeLists.txt.
          actual=$("$exe" --version | tr -d '\r')
          if [ -n "$VERSION" ] && [ "$actual" != "DATRACKARXD ${VERSION#v}" ]; then
            echo "::error::Release $VERSION does not match the program version: $actual"
            exit 1
          fi
          "$exe" --export-demo demo.wav
          "$exe" --convert songs/demo.dtk check.dtk
          test -s demo.wav
          "$exe" --export songs/demo.dtk demo.ogg
          "$exe" --export-midi songs/demo.dtk demo.mid
          test -s demo.ogg && test -s demo.mid
          # The emulated chips (AY, SN76489, Game Boy, OPL3) and channel effects.
          "$exe" --export songs/chips.dtk chips.wav
          test -s chips.wav
          # Module and VGM exports, and the modules read back by the importers.
          for f in xm mod it; do
            "$exe" --export-module songs/demo.dtk "demo.$f"
            "$exe" --export-module songs/chips.dtk "chips.$f"
            test -s "demo.$f" && test -s "chips.$f"
            "$exe" --convert "demo.$f" "back-$f.dtk"
            test -s "back-$f.dtk"
          done
          [ "$(head -c 17 demo.xm)" = "Extended Module: " ]
          [ "$(head -c 4 demo.it)" = "IMPM" ]
          "$exe" --export-vgm songs/chips.dtk chips.vgm
          [ "$(head -c 4 chips.vgm)" = "Vgm " ]
          # An exported keygen player must start and play on every OS.
          player=player
          [ "${{ runner.os }}" = "Windows" ] && player=player.exe
          "$exe" --export-player songs/demo.dtk "$player"
          "./$player" --selftest
          # The separate keygen app makes players too.
          "$kg" --version
          "$kg" --export songs/demo.dtk "kg-$player" "DATRACKARXD" "ci test"
          "./kg-$player" --selftest
          cp "$exe" "$kg" .

      - name: Package
        shell: bash
        run: |
          dir=datrackarxd-${VERSION:-dev}-${{ matrix.name }}
          mkdir -p "$dir/songs"
          cp README.md "$dir/"
          cp songs/*.dtk "$dir/songs/"
          # Licenses of the libraries built into the programs.
          mkdir -p "$dir/licenses"
          for pair in imgui:imgui-src/LICENSE.txt sdl2:sdl2-src/LICENSE.txt rtmidi:rtmidi-src/LICENSE \
                      libogg:ogg-src/COPYING libvorbis:vorbis-src/COPYING ymfm:ymfm-src/LICENSE dr_libs:drlibs-src/LICENSE; do
            file="build/_deps/${pair#*:}"
            if [ -f "$file" ]; then cp "$file" "$dir/licenses/${pair%%:*}.txt"; else echo "::warning::missing $file"; fi
          done
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp datrackarxd.exe datrackarxd-keygen.exe "$dir/"
            7z a "$dir.zip" "$dir" > /dev/null
          else
            cp datrackarxd datrackarxd-keygen "$dir/"
            tar czf "$dir.tar.gz" "$dir"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: datrackarxd-${{ matrix.name }}
          path: |
            datrackarxd-*.zip
            datrackarxd-*.tar.gz

  release:
    needs: [build, sanitizers]
    if: startsWith(github.ref_type == 'tag' && github.ref_name || inputs.version, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: DATRACKARXD ${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
